<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimyasal Molekül Bağlanma Simülasyonu (2D / 3D)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d0f17;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #canvas2d, #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #canvas3d {
      display: none;
    }
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(20, 24, 38, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 18px 22px;
      border-radius: 14px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      min-width: 260px;
    }
    .controls h3 {
      font-size: 15px;
      font-weight: 700;
      color: #38ef7d;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 13px;
      color: #a0aec0;
    }
    .mode-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #a0aec0;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .mode-btn.active {
      background: #11998e;
      color: #fff;
      box-shadow: 0 2px 8px rgba(17, 153, 142, 0.4);
    }
    select, button.btn-action {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select option {
      background: #141826;
      color: #fff;
    }
    .btn-action {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      border: none;
      font-weight: 700;
      transition: transform 0.2s;
    }
    .btn-action:hover {
      transform: translateY(-1px);
    }
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 11px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
  <!-- Three.js (3D Görselleştirme İçin) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="canvas2d"></canvas>
  <div id="canvas3d"></div>

  <div class="controls">
    <h3>Mod Seçimi</h3>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn2D" onclick="setMode('2D')">2 Boyut</button>
      <button class="mode-btn" id="btn3D" onclick="setMode('3D')">3 Boyut</button>
    </div>

    <div class="control-group">
      <label>Hazır Bileşik/Set Seçin:</label>
      <select id="compoundSelect" onchange="loadCompound()">
        <option value="H2O">Su (H₂O)</option>
        <option value="CO2">Karbondioksit (CO₂)</option>
        <option value="CH4">Metan (CH₄)</option>
        <option value="NH3">Amonyak (NH₃)</option>
        <option value="MIX">Karışık Serbest Atomlar</option>
      </select>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="dot" style="background:#ffffff;"></div> H (Hidrojen)</div>
      <div class="legend-item"><div class="dot" style="background:#ff4757;"></div> O (Oksijen)</div>
      <div class="legend-item"><div class="dot" style="background:#30336b;"></div> C (Karbon)</div>
      <div class="legend-item"><div class="dot" style="background:#70a1ff;"></div> N (Azot)</div>
    </div>

    <button class="btn-action" onclick="loadCompound()">Yeniden Başlat / Bağla</button>
  </div>

  <script>
    // Element Özellikleri (Kimyasal Standart Renk ve Boyutlar)
    const ELEMENTS = {
      H: { name: 'Hidrojen', color: '#ffffff', radius: 10, mass: 1 },
      O: { name: 'Oksijen',  color: '#ff4757', radius: 18, mass: 16 },
      C: { name: 'Karbon',   color: '#57606f', radius: 20, mass: 12 },
      N: { name: 'Azot',     color: '#70a1ff', radius: 18, mass: 14 }
    };

    // Bileşik Tanımları (Hedef Bağlar)
    const COMPOUNDS = {
      H2O: {
        atoms: ['O', 'H', 'H'],
        targetBonds: [[0, 1], [0, 2]] // O-H bağları
      },
      CO2: {
        atoms: ['C', 'O', 'O'],
        targetBonds: [[0, 1], [0, 2]] // C-O bağları
      },
      CH4: {
        atoms: ['C', 'H', 'H', 'H', 'H'],
        targetBonds: [[0, 1], [0, 2], [0, 3], [0, 4]] // C-H bağları
      },
      NH3: {
        atoms: ['N', 'H', 'H', 'H'],
        targetBonds: [[0, 1], [0, 2], [0, 3]] // N-H bağları
      },
      MIX: {
        atoms: ['C', 'O', 'O', 'H', 'H', 'H', 'H', 'N', 'H', 'H', 'H'],
        targetBonds: []
      }
    };

    let currentMode = '2D';
    let currentCompoundKey = 'H2O';

    // Canvas Elemanları
    const canvas2d = document.getElementById('canvas2d');
    const ctx2d = canvas2d.getContext('2d');
    const container3d = document.getElementById('canvas3d');

    // 2D Atom Mantığı
    let atoms2D = [];

    class Atom2D {
      constructor(type, x, y) {
        this.type = type;
        this.info = ELEMENTS[type];
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Ekran Sınırlarından Yavaşça Sekme
        if (this.x < 50 || this.x > canvas2d.width - 50) this.vx *= -0.8;
        if (this.y < 50 || this.y > canvas2d.height - 50) this.vy *= -0.8;

        this.vx *= 0.98; // Sürtünme
        this.vy *= 0.98;
      }

      draw() {
        ctx2d.beginPath();
        ctx2d.arc(this.x, this.y, this.info.radius, 0, Math.PI * 2);
        ctx2d.fillStyle = this.info.color;
        ctx2d.fill();
        ctx2d.lineWidth = 2;
        ctx2d.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx2d.stroke();

        // Element Sembolü
        ctx2d.fillStyle = this.type === 'H' ? '#000' : '#fff';
        ctx2d.font = 'bold 12px sans-serif';
        ctx2d.textAlign = 'center';
        ctx2d.textBaseline = 'middle';
        ctx2d.fillText(this.type, this.x, this.y);
      }
    }

    function resize2D() {
      canvas2d.width = window.innerWidth;
      canvas2d.height = window.innerHeight;
    }
    window.addEventListener('resize', resize2D);

    function init2DCompound() {
      resize2D();
      atoms2D = [];
      const compound = COMPOUNDS[currentCompoundKey];
      const centerX = canvas2d.width / 2;
      const centerY = canvas2d.height / 2;

      compound.atoms.forEach((elem) => {
        // Dağınık konumlandır, yavaşça bağlansınlar
        let offsetX = (Math.random() - 0.5) * 300;
        let offsetY = (Math.random() - 0.5) * 300;
        atoms2D.push(new Atom2D(elem, centerX + offsetX, centerY + offsetY));
      });
    }

    function animate2D() {
      if (currentMode === '2D') {
        ctx2d.clearRect(0, 0, canvas2d.width, canvas2d.height);

        const compound = COMPOUNDS[currentCompoundKey];

        // Hazır tanım bağlarına göre yavaşça çekim kuvveti uygula
        if (compound.targetBonds.length > 0) {
          compound.targetBonds.forEach(([i, j]) => {
            let a1 = atoms2D[i];
            let a2 = atoms2D[j];

            if (a1 && a2) {
              let dx = a2.x - a1.x;
              let dy = a2.y - a1.y;
              let dist = Math.sqrt(dx * dx + dy * dy);
              let targetDist = a1.info.radius + a2.info.radius + 15; // İdeal bağ mesafesi

              // Yavaş Çekim Kuvveti (Yay Modeli)
              let force = (dist - targetDist) * 0.003;
              let fx = (dx / dist) * force;
              let fy = (dy / dist) * force;

              a1.vx += fx;
              a1.vy += fy;
              a2.vx -= fx;
              a2.vy -= fy;

              // Bağ Çizgisi (Çift / Tek Kimyasal Bağ Çizimi)
              ctx2d.beginPath();
              ctx2d.moveTo(a1.x, a1.y);
              ctx2d.lineTo(a2.x, a2.y);
              ctx2d.strokeStyle = 'rgba(255, 255, 255, 0.6)';
              ctx2d.lineWidth = 4;
              ctx2d.stroke();
            }
          });
        }

        atoms2D.forEach(atom => {
          atom.update();
          atom.draw();
        });
      }
      requestAnimationFrame(animate2D);
    }

    // --- 3D SİMÜLASYONU (Three.js) ---
    let scene, camera, renderer, atoms3D = [], bonds3DGroup;

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 300;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container3d.appendChild(renderer.domElement);

      // Ortam Işıkları
      const light1 = new THREE.DirectionalLight(0xffffff, 1);
      light1.position.set(1, 1, 1).normalize();
      scene.add(light1);
      scene.add(new THREE.AmbientLight(0x404040));

      bonds3DGroup = new THREE.Group();
      scene.add(bonds3DGroup);

      animate3D();
    }

    function init3DCompound() {
      // Temizle
      atoms3D.forEach(a => scene.remove(a.mesh));
      atoms3D = [];

      const compound = COMPOUNDS[currentCompoundKey];

      compound.atoms.forEach((elemType) => {
        const info = ELEMENTS[elemType];
        const geo = new THREE.SphereGeometry(info.radius * 0.6, 32, 32);
        const mat = new THREE.MeshPhongMaterial({ 
          color: info.color, 
          shininess: 80 
        });
        const mesh = new THREE.Mesh(geo, mat);

        mesh.position.set(
          (Math.random() - 0.5) * 150,
          (Math.random() - 0.5) * 150,
          (Math.random() - 0.5) * 150
        );

        mesh.userData = {
          type: elemType,
          info: info,
          vx: 0, vy: 0, vz: 0
        };

        scene.add(mesh);
        atoms3D.push(mesh);
      });
    }

    function animate3D() {
      requestAnimationFrame(animate3D);

      if (currentMode === '3D' && renderer) {
        scene.rotation.y += 0.003; // Molekülün yavaş dönmesi

        // 3D Bağları Temizle
        while(bonds3DGroup.children.length > 0) { 
          const obj = bonds3DGroup.children[0];
          bonds3DGroup.remove(obj); 
          if(obj.geometry) obj.geometry.dispose();
        }

        const compound = COMPOUNDS[currentCompoundKey];

        if (compound.targetBonds.length > 0) {
          compound.targetBonds.forEach(([i, j]) => {
            let a1 = atoms3D[i];
            let a2 = atoms3D[j];

            if (a1 && a2) {
              let p1 = a1.position;
              let p2 = a2.position;
              let dist = p1.distanceTo(p2);
              let targetDist = (a1.userData.info.radius + a2.userData.info.radius) * 0.7;

              // Yavaşça birbirlerine çekilme
              let force = (dist - targetDist) * 0.002;
              let dir = new THREE.Vector3().subVectors(p2, p1).normalize();

              a1.userData.vx += dir.x * force;
              a1.userData.vy += dir.y * force;
              a1.userData.vz += dir.z * force;

              a2.userData.vx -= dir.x * force;
              a2.userData.vy -= dir.y * force;
              a2.userData.vz -= dir.z * force;

              // 3D Çubuk (Bağ) Çizimi
              let lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
              let lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
              let line = new THREE.Line(lineGeo, lineMat);
              bonds3DGroup.add(line);
            }
          });
        }

        // Konum Güncelleme
        atoms3D.forEach(a => {
          a.userData.vx *= 0.95;
          a.userData.vy *= 0.95;
          a.userData.vz *= 0.95;

          a.position.x += a.userData.vx;
          a.position.y += a.userData.vy;
          a.position.z += a.userData.vz;
        });

        renderer.render(scene, camera);
      }
    }

    // --- MOD VE AYAR YÖNETİMİ ---
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn2D').classList.toggle('active', mode === '2D');
      document.getElementById('btn3D').classList.toggle('active', mode === '3D');

      if (mode === '2D') {
        canvas2d.style.display = 'block';
        container3d.style.display = 'none';
      } else {
        canvas2d.style.display = 'none';
        container3d.style.display = 'block';
        if (!renderer) init3D();
      }
      loadCompound();
    }

    function loadCompound() {
      currentCompoundKey = document.getElementById('compoundSelect').value;
      if (currentMode === '2D') {
        init2DCompound();
      } else {
        init3DCompound();
      }
    }

    // Başlangıç
    loadCompound();
    animate2D();
  </script>
</body>
</html>
