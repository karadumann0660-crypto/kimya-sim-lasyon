<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanecik Bağlanma Simülasyonu (2D / 3D)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d0f17;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #canvas2d, #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #canvas3d {
      display: none;
    }
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(20, 24, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 18px 22px;
      border-radius: 14px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      min-width: 240px;
    }
    .controls h3 {
      font-size: 16px;
      font-weight: 600;
      color: #38ef7d;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 13px;
      color: #a0aec0;
      display: flex;
      justify-content: space-between;
    }
    .mode-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #a0aec0;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .mode-btn.active {
      background: #11998e;
      color: #fff;
      box-shadow: 0 2px 8px rgba(17, 153, 142, 0.4);
    }
    input[type=range] {
      width: 100%;
      accent-color: #38ef7d;
      cursor: pointer;
    }
    .btn-reset {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-reset:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3);
    }
  </style>
  <!-- Three.js (3D Görselleştirme İçin) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="canvas2d"></canvas>
  <div id="canvas3d"></div>

  <div class="controls">
    <h3>Mod Seçimi</h3>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn2D" onclick="setMode('2D')">2 Boyut</button>
      <button class="mode-btn" id="btn3D" onclick="setMode('3D')">3 Boyut</button>
    </div>

    <div class="control-group">
      <label>Tanecik Sayısı: <span id="countVal">60</span></label>
      <input type="range" id="particleCount" min="20" max="150" value="60" oninput="updateSettings()">
    </div>

    <div class="control-group">
      <label>Bağlanma Yavaşığı (Çekim): <span id="speedVal">Yavaş</span></label>
      <input type="range" id="attractionSpeed" min="1" max="10" value="2" oninput="updateSettings()">
    </div>

    <div class="control-group">
      <label>Bağlantı Mesafesi: <span id="distVal">150</span></label>
      <input type="range" id="connectDist" min="80" max="300" value="150" oninput="updateSettings()">
    </div>

    <button class="btn-reset" onclick="initSimulation()">Yeniden Başlat</button>
  </div>

  <script>
    // Genel Ayarlar
    let currentMode = '2D';
    let pCount = 60;
    let attractionForce = 0.0005; // Yavaşça bağlanma kuvveti
    let maxDistance = 150;

    // Canvas Elemanları
    const canvas2d = document.getElementById('canvas2d');
    const ctx2d = canvas2d.getContext('2d');
    const container3d = document.getElementById('canvas3d');

    // Three.js Değişkenleri
    let scene, camera, renderer, particles3D = [], linesGroup3D;

    // --- GENEL FONKSİYONLAR ---
    function updateSettings() {
      pCount = parseInt(document.getElementById('particleCount').value);
      document.getElementById('countVal').innerText = pCount;

      const speedRaw = parseInt(document.getElementById('attractionSpeed').value);
      attractionForce = speedRaw * 0.00025; // Yavaş ve yumuşak çekim ivmesi
      
      if(speedRaw <= 3) document.getElementById('speedVal').innerText = "Çok Yavaş";
      else if(speedRaw <= 7) document.getElementById('speedVal').innerText = "Orta";
      else document.getElementById('speedVal').innerText = "Hızlı";

      maxDistance = parseInt(document.getElementById('connectDist').value);
      document.getElementById('distVal').innerText = maxDistance;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn2D').classList.toggle('active', mode === '2D');
      document.getElementById('btn3D').classList.toggle('active', mode === '3D');

      if (mode === '2D') {
        canvas2d.style.display = 'block';
        container3d.style.display = 'none';
      } else {
        canvas2d.style.display = 'none';
        container3d.style.display = 'block';
        if (!renderer) init3D();
      }
      initSimulation();
    }

    function initSimulation() {
      updateSettings();
      if (currentMode === '2D') {
        init2D();
      } else {
        init3DParticles();
      }
    }

    // --- 2D SİMÜLASYONU ---
    let particles2D = [];

    function resize2D() {
      canvas2d.width = window.innerWidth;
      canvas2d.height = window.innerHeight;
    }
    window.addEventListener('resize', () => {
      resize2D();
      if (renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    class Particle2D {
      constructor() {
        this.x = Math.random() * canvas2d.width;
        this.y = Math.random() * canvas2d.height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.radius = 4;
      }

      update() {
        // Yumuşak Hareket
        this.x += this.vx;
        this.y += this.vy;

        // Ekran Sınırlarından Sekme
        if (this.x < 0 || this.x > canvas2d.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas2d.height) this.vy *= -1;
      }

      draw() {
        ctx2d.beginPath();
        ctx2d.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx2d.fillStyle = '#38ef7d';
        ctx2d.shadowBlur = 10;
        ctx2d.shadowColor = '#38ef7d';
        ctx2d.fill();
        ctx2d.shadowBlur = 0;
      }
    }

    function init2D() {
      resize2D();
      particles2D = [];
      for (let i = 0; i < pCount; i++) {
        particles2D.push(new Particle2D());
      }
    }

    function animate2D() {
      if (currentMode === '2D') {
        ctx2d.clearRect(0, 0, canvas2d.width, canvas2d.height);

        // Tanecikler arası etkileşim ve yavaşça bağlanma mantığı
        for (let i = 0; i < particles2D.length; i++) {
          for (let j = i + 1; j < particles2D.length; j++) {
            let p1 = particles2D[i];
            let p2 = particles2D[j];

            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDistance) {
              // Yavaşça birbirlerine doğru çekilme (Bağlanma kuvveti)
              let force = (maxDistance - dist) * attractionForce;
              let fx = (dx / dist) * force;
              let fy = (dy / dist) * force;

              p1.vx += fx;
              p1.vy += fy;
              p2.vx -= fx;
              p2.vy -= fy;

              // Bağlantı Çizgisi (Mesafe kısaldıkça belirginleşir)
              let alpha = 1 - (dist / maxDistance);
              ctx2d.beginPath();
              ctx2d.moveTo(p1.x, p1.y);
              ctx2d.lineTo(p2.x, p2.y);
              ctx2d.strokeStyle = `rgba(17, 153, 142, ${alpha})`;
              ctx2d.lineWidth = alpha * 2;
              ctx2d.stroke();
            }
          }
        }

        // Hız Sınırlaması ve Sürtünme (Kararlı yavaş bağlanma için)
        particles2D.forEach(p => {
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.update();
          p.draw();
        });
      }
      requestAnimationFrame(animate2D);
    }

    // --- 3D SİMÜLASYONU (Three.js) ---
    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 400;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container3d.appendChild(renderer.domElement);

      linesGroup3D = new THREE.Group();
      scene.add(linesGroup3D);

      animate3D();
    }

    function init3DParticles() {
      // Eski 3D nesneleri temizle
      for (let i = scene.children.length - 1; i >= 0; i--) {
        if (scene.children[i] !== linesGroup3D) scene.remove(scene.children[i]);
      }
      particles3D = [];

      const geo = new THREE.SphereGeometry(2.5, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color: 0x38ef7d });

      for (let i = 0; i < pCount; i++) {
        let mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          (Math.random() - 0.5) * 350,
          (Math.random() - 0.5) * 350,
          (Math.random() - 0.5) * 350
        );
        mesh.userData = {
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          vz: (Math.random() - 0.5) * 0.5
        };
        scene.add(mesh);
        particles3D.push(mesh);
      }
    }

    function animate3D() {
      requestAnimationFrame(animate3D);

      if (currentMode === '3D' && renderer) {
        // Sahneyi yavaşça döndür
        scene.rotation.y += 0.0015;

        // Çizgileri temizle
        while(linesGroup3D.children.length > 0) { 
          const obj = linesGroup3D.children[0];
          linesGroup3D.remove(obj); 
          if(obj.geometry) obj.geometry.dispose();
        }

        // Çekim ve Bağlanma Mantığı
        for (let i = 0; i < particles3D.length; i++) {
          for (let j = i + 1; j < particles3D.length; j++) {
            let p1 = particles3D[i];
            let p2 = particles3D[j];

            let dist = p1.position.distanceTo(p2.position);

            if (dist < maxDistance) {
              // Yavaşça birbirlerine doğru çekilme
              let force = (maxDistance - dist) * (attractionForce * 0.8);
              let dir = new THREE.Vector3().subVectors(p2.position, p1.position).normalize();

              p1.userData.vx += dir.x * force;
              p1.userData.vy += dir.y * force;
              p1.userData.vz += dir.z * force;

              p2.userData.vx -= dir.x * force;
              p2.userData.vy -= dir.y * force;
              p2.userData.vz -= dir.z * force;

              // Bağlantı Çizgisi Oluşturma
              let alpha = 1 - (dist / maxDistance);
              let lineMat = new THREE.LineBasicMaterial({
                color: 0x11998e,
                transparent: true,
                opacity: alpha
              });
              let lineGeo = new THREE.BufferGeometry().setFromPoints([p1.position, p2.position]);
              let line = new THREE.Line(lineGeo, lineMat);
              linesGroup3D.add(line);
            }
          }
        }

        // Konum Güncelleme
        particles3D.forEach(p => {
          p.userData.vx *= 0.98;
          p.userData.vy *= 0.98;
          p.userData.vz *= 0.98;

          p.position.x += p.userData.vx;
          p.position.y += p.userData.vy;
          p.position.z += p.userData.vz;

          // Küresel sınır kontrolü (Merkeze geri çekme)
          if(p.position.length() > 250) {
            p.userData.vx -= p.position.x * 0.001;
            p.userData.vy -= p.position.y * 0.001;
            p.userData.vz -= p.position.z * 0.001;
          }
        });

        renderer.render(scene, camera);
      }
    }

    // Başlangıç
    initSimulation();
    animate2D();
  </script>
</body>
</html>
